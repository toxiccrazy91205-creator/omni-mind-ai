version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  db:
    # Optional Postgres DB for later, currently using SQLite locally
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=omnimind
      - POSTGRES_PASSWORD=omnimind
      - POSTGRES_DB=omnimind_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
